name = "clubsplatform"
compatibility_date = "2024-09-23"
pages_build_output_dir = "website/dist"
compatibility_flags = [ "nodejs_compat" ]

# ---------------------------------------------------------------------------
# Default vars (used by `wrangler pages dev` without --env, and inherited
# only where not overridden in an env block below). For Cloudflare Pages
# deployments, the [env.production] / [env.preview] blocks are what get
# applied — top-level d1 bindings are intentionally NOT defined so that
# every deploy uses an explicit, environment-scoped database.
#
# SECRETS: BETTER_AUTH_SECRET, SECRETS_ENCRYPTION_KEY, and
# SECRETS_TRANSPORT_PRIVATE_KEY must be set per environment via
#   wrangler pages secret put <NAME> --project-name clubsplatform
#   wrangler pages secret put <NAME> --project-name clubsplatform --env preview
# with **different** values per env. For local dev add them to a gitignored
# .dev.vars file.
# ---------------------------------------------------------------------------
[vars]
MULTI_CLUB = "true"
# GoCardless environment: "sandbox" for testing, "live" for production.
# The flip to "live" in [env.production.vars] is the final manual go-live toggle.
GC_ENVIRONMENT = "sandbox"
# PostHog ingest host, for `wrangler pages dev` without --env. Deployments read
# the copies in the [env.*] blocks below, not this one. Pair it with
# POSTHOG_API_KEY in .dev.vars to send events from a local worker.
POSTHOG_HOST = "https://p.touchlinehq.co.uk"
# Envelope sender for transactional email (password resets, sign-up
# verification, player-import invitations). The matching EMAIL_API_KEY is a
# secret — see the README. getMailer() returns null unless BOTH are set, which
# disables sending silently, exactly like POSTHOG_API_KEY.
EMAIL_FROM = "no-reply@touchlinehq.co.uk"
# SECRETS_ENCRYPTION_KEY must be set via Cloudflare dashboard secrets (NOT here) — 64 hex chars (32 bytes)
# For local dev, add to .dev.vars: SECRETS_ENCRYPTION_KEY=<output of: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))">
#
# RSA-2048 transport key pair for browser-to-worker encryption. Generate with:
#   node -e "const c=require('crypto');const {privateKey,publicKey}=c.generateKeyPairSync('rsa',{modulusLength:2048,publicKeyEncoding:{type:'spki',format:'der'},privateKeyEncoding:{type:'pkcs8',format:'der'}});console.log('SECRETS_TRANSPORT_PRIVATE_KEY='+privateKey.toString('base64'));console.log('SECRETS_TRANSPORT_PUBLIC_KEY='+publicKey.toString('base64'));"
# SECRETS_TRANSPORT_PRIVATE_KEY → Cloudflare dashboard secrets (never commit); for local dev add to .dev.vars
# SECRETS_TRANSPORT_PUBLIC_KEY  → not sensitive; add to .dev.vars and set below (or in dashboard)
# Uncomment to enable pitch booking features (pitch schedule, booking requests)
# PITCH_BOOKINGS = "true"

# ---------------------------------------------------------------------------
# Production environment — applied to deploys on the production branch
# (`main`). Bind the live D1 here.
# ---------------------------------------------------------------------------
[env.production]

[[env.production.d1_databases]]
binding = "DB"
database_name = "clubsplatform-auth"
database_id = "65a7e9d9-3772-4471-af13-fd2e39ab8f90"
migrations_table = "migrations"
migrations_dir = "migrations"

[env.production.vars]
MULTI_CLUB = "true"
# Final manual go-live toggle: flip to "live" via Cloudflare dashboard or by
# editing this line once all other go-live checks have passed.
GC_ENVIRONMENT = "live"
# PostHog ingest host for the Pages Functions. The matching POSTHOG_API_KEY is
# a secret (`wrangler pages secret put POSTHOG_API_KEY`) — it cannot live here,
# and cannot be set in the dashboard either, because this file is the source of
# truth for the project's vars. getPostHog() returns null unless BOTH are set,
# which disables backend analytics silently.
POSTHOG_HOST = "https://p.touchlinehq.co.uk"
EMAIL_FROM = "no-reply@touchlinehq.co.uk"

# ---------------------------------------------------------------------------
# Preview environment — applied to deploys on every non-production branch
# (PR previews, branch previews). Bind the dedicated preview D1.
# ---------------------------------------------------------------------------
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "clubsplatform-preview"
database_id = "895c505d-ccc6-49d9-87ba-375ef9492f19"
migrations_table = "migrations"
migrations_dir = "migrations"

[env.preview.vars]
MULTI_CLUB = "true"
GC_ENVIRONMENT = "sandbox"
# Repeated rather than inherited: `vars` is non-inheritable for Pages, and this
# block overrides the top-level [vars], so anything omitted here is simply
# absent from preview deployments.
POSTHOG_HOST = "https://p.touchlinehq.co.uk"
EMAIL_FROM = "no-reply@touchlinehq.co.uk"
