name: Test

# Push-to-main is covered by the `test` job in main.yml, which the deploy job
# depends on. Running it here too would duplicate the work and race the deploy.
on:
  pull_request:

jobs:
  test:
    name: Tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      # Before the suite, not after: a type error surfaces in seconds instead
      # of behind a full vitest run. functions/ has no other compiler gate —
      # vitest strips its types with esbuild and never checks them.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
