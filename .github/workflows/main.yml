name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

jobs:
  # Gate: the deploy job below will not start unless this passes. Previously
  # test.yml raced the deploy on push-to-main, so a red suite could still ship.
  test:
    name: Tests with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Run tests with coverage
        run: npm run test:coverage

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      # The Pages Functions in functions/ import hono, better-auth and
      # posthog-node from the ROOT package.json, and esbuild resolves upward
      # from functions/ — it never looks in website/node_modules. Without this
      # step the bundle only compiled because cloudflare/wrangler-action ran
      # `npm i wrangler@4` at the repo root as a side effect of the migration
      # steps below, which also left the working tree dirty. Installing the
      # root deps explicitly makes the Functions build deterministic and lets
      # the action reuse the pinned wrangler from devDependencies.
      - name: Install root dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      # Apply to preview first as a canary so a broken migration trips here
      # before touching production data.
      - name: Apply DB migrations (preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 migrations apply clubsplatform-preview --remote --env preview
      - name: Apply DB migrations (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 migrations apply clubsplatform-auth --remote --env production
      # This is a direct-upload Pages project, so the dashboard's build
      # environment variables never run. VITE_* values must be injected here or
      # they are undefined in the bundle. Both are repository *variables*, not
      # secrets: the PostHog project key is a write-only public key that ships
      # in the client bundle regardless, and the host is already in our CSP.
      #
      # The POSTHOG_CLI_* values drive source map upload to PostHog error
      # tracking (see website/vite.config.mts). Without them a frontend
      # exception is reported against a minified chunk, which nobody — human or
      # agent — can act on. Unlike the VITE_* pair, POSTHOG_CLI_API_KEY is a
      # genuine *secret*: it is a personal API key, not the project write key,
      # so it must never be a repository variable and must never reach the
      # client bundle. The build succeeds without it and simply skips the
      # upload, which is what keeps forks and the PR workflow working.
      - name: Build
        run: npm run build
        working-directory: website
        env:
          VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=clubsplatform --branch=main
