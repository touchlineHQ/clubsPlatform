name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

jobs:
  # Gate: the deploy job below will not start unless this passes. Previously
  # test.yml raced the deploy on push-to-main, so a red suite could still ship.
  test:
    name: Tests with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      # Same gate as test.yml. Deploy depends on this job, so a type error
      # stops the release rather than shipping.
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests with coverage
        run: npm run test:coverage

  # Blocking pre-production gate: deploy this commit as a Cloudflare preview and
  # run the end-to-end smoke suite against it before production is touched.
  #
  # This is the tier that exercises what `wrangler pages dev` cannot — a real
  # deployment, the remote D1, and the CSP in website/public/_headers. It lives
  # here rather than on pull requests because every preview binds the one shared
  # clubsplatform-preview database: migrating that database is only safe for code
  # that has already been reviewed, and without the migration the smoke suite would
  # be testing against the wrong schema.
  preview-e2e:
    name: E2E against a Cloudflare preview
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm ci
        working-directory: website

      # Moved here from the deploy job, and deliberately NOT behind the Access
      # check below. It is still the canary — a broken migration trips against
      # preview before production data is touched — and it is also what makes the
      # smoke suite meaningful, since it runs against the migrated schema. Gating
      # it on the Access credentials would silently delete the canary the moment
      # those secrets went missing. It needs only CLOUDFLARE_API_TOKEN.
      - name: Apply DB migrations (preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 migrations apply clubsplatform-preview --remote --env preview

      # Preview deployments sit behind Cloudflare Access, so reaching one needs a
      # service token (Zero Trust -> Access -> Service Auth, with a Service Auth
      # policy on the application covering *.clubsplatform.pages.dev). Without it
      # every request is answered with a 302 to <team>.cloudflareaccess.com.
      #
      # Secrets cannot be referenced from a job-level `if:`, so the check happens
      # here and every step below is conditioned on its output. Skipping leaves the
      # job successful on purpose: main keeps shipping while the token is being set
      # up, and the gate switches itself on as soon as both secrets exist.
      - name: Check for Cloudflare Access credentials
        id: access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview E2E skipped::CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET are not set. Preview deployments are behind Cloudflare Access, so the smoke suite cannot reach one without a service token. Production deploy proceeds ungated."
          fi

      - name: Install Playwright browser
        if: steps.access.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      # No POSTHOG_CLI_* here, unlike the production build below: a throwaway
      # preview must not create a PostHog release or upload source maps. That is
      # also why the deploy job builds again rather than reusing an artifact from
      # this job — the plugin stamps chunk ids at build time, so the two bundles
      # genuinely differ.
      - name: Build
        if: steps.access.outputs.configured == 'true'
        run: npm run build
        working-directory: website
        env:
          VITE_POSTHOG_DISABLED: 'true'
          VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      - name: Verify seed assets are in the build output
        if: steps.access.outputs.configured == 'true'
        run: test -s website/dist/data/clubs/demo/club.json

      # --branch must NOT be "main". Pages treats a deploy whose branch matches the
      # project's production branch as a production deployment, so that one flag
      # would ship this commit to production before any of the tests below ran.
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        if: steps.access.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy website/dist --project-name=clubsplatform --branch=ci-preview

      # The immutable per-deployment URL, not the branch alias: Cloudflare
      # sanitizes and truncates aliases, so the alias host is not reliably
      # predictable.
      - name: Resolve the deployment URL
        if: steps.access.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          COMMAND_STDERR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          url="$DEPLOYMENT_URL"
          if [ -z "$url" ]; then
            echo "deployment-url output was empty; falling back to the command output."
            url=$(printf '%s\n%s\n' "$COMMAND_OUTPUT" "$COMMAND_STDERR" \
              | grep -oE 'https://[0-9a-f]+\.clubsplatform\.pages\.dev' \
              | head -n 1)
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the preview deployment URL."
            exit 1
          fi
          echo "Preview deployment: $url"
          echo "E2E_BASE_URL=$url" >> "$GITHUB_ENV"

      # Poll /api/clubs rather than /: the SPA shell answers 200 before D1 is
      # reachable, and requiring the demo club in the body catches cold start,
      # propagation and an empty registry in one check.
      #
      # The status code is captured rather than leaning on `curl -f`, so an Access
      # redirect can be reported as what it is. A 302 to cloudflareaccess.com here
      # means the service token is wrong, or its policy is not a Service Auth
      # policy — which otherwise presents as an indistinguishable timeout.
      - name: Wait for the deployment to serve the club registry
        if: steps.access.outputs.configured == 'true'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          body=$(mktemp)
          status=0
          for i in $(seq 1 30); do
            status=$(curl -sS -o "$body" -w '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$E2E_BASE_URL/api/clubs" || true)
            if [ "$status" = "200" ] && grep -q '"slug":"demo"' "$body"; then
              echo "Ready after $((i * 2))s."
              exit 0
            fi
            sleep 2
          done
          echo "::error::$E2E_BASE_URL/api/clubs did not report the demo club within 60s (last status: $status)."
          if [ "$status" = "302" ] || grep -qi 'cloudflareaccess\.com' "$body"; then
            echo "::error::Cloudflare Access rejected the request. Check that CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET match a current service token, and that the Access application covering *.clubsplatform.pages.dev has a policy whose action is Service Auth — an Allow policy will not accept service-token headers."
          fi
          head -c 500 "$body" || true
          exit 1

      # Every spec is @smoke today, so this is the whole suite. The tag stays as
      # the contract for "safe to run against the shared preview database", which
      # these specs must remain: they are read-only.
      - name: Run E2E smoke tests
        if: steps.access.outputs.configured == 'true'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: preview-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      # The Pages Functions in functions/ import hono, better-auth and
      # posthog-node from the ROOT package.json, and esbuild resolves upward
      # from functions/ — it never looks in website/node_modules. Without this
      # step the bundle only compiled because cloudflare/wrangler-action ran
      # `npm i wrangler@4` at the repo root as a side effect of the migration
      # steps below, which also left the working tree dirty. Installing the
      # root deps explicitly makes the Functions build deterministic and lets
      # the action reuse the pinned wrangler from devDependencies.
      - name: Install root dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Apply DB migrations (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 migrations apply clubsplatform-auth --remote --env production
      # This is a direct-upload Pages project, so the dashboard's build
      # environment variables never run. VITE_* values must be injected here or
      # they are undefined in the bundle. Both are repository *variables*, not
      # secrets: the PostHog project key is a write-only public key that ships
      # in the client bundle regardless, and the host is already in our CSP.
      #
      # The POSTHOG_CLI_* values drive source map upload to PostHog error
      # tracking (see website/vite.config.mts). Without them a frontend
      # exception is reported against a minified chunk, which nobody — human or
      # agent — can act on. Unlike the VITE_* pair, POSTHOG_CLI_API_KEY is a
      # genuine *secret*: it is a personal API key, not the project write key,
      # so it must never be a repository variable and must never reach the
      # client bundle. The build succeeds without it and simply skips the
      # upload, which is what keeps forks and the PR workflow working.
      - name: Build
        run: npm run build
        working-directory: website
        env:
          VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=clubsplatform --branch=main
