name: E2E

# The local end-to-end tier, and the only one that runs on a pull request: the
# built bundle served by `wrangler pages dev` against a throwaway local D1. No
# credentials, so it works on forks, and a fresh database every run makes it
# deterministic — which is what makes it worth requiring as a status check.
#
# The tier that exercises a real Cloudflare deployment lives in main.yml, as a
# blocking gate between the test suite and the production deploy. It is not here
# because a preview deployment is only meaningful once the code is merged: every
# preview binds the one shared clubsplatform-preview database, and that database
# can only be migrated safely for code that has already been reviewed.
#
# Kept separate from test.yml so the fast typecheck-and-vitest gate stays
# uncluttered, and so the two show up as distinct checks.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A pull request that is pushed to repeatedly does not need every intermediate
# commit tested to completion.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-local:
    name: E2E against a local preview build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # VITE_POSTHOG_DISABLED must be the exact string "true", and the key/host
      # pair has to be present alongside it: init() in website/src/lib/posthog.ts
      # checks for a missing key BEFORE it checks the disable flag and logs a
      # console error on that path. Both values are repository *variables*, not
      # secrets — the project key is write-only and ships in the client bundle
      # anyway — so they resolve on forks as well.
      #
      # POSTHOG_CLI_API_KEY is deliberately absent: without it
      # website/vite.config.mts leaves the source-map plugin out entirely, so
      # nothing is generated and no PostHog release is created for a test build.
      - name: Build
        run: npm run build
        working-directory: website
        env:
          VITE_POSTHOG_DISABLED: 'true'
          VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      # functions/lib/seed.ts reads the club's JSON through the ASSETS binding and
      # treats an HTML response as absent — which is what the SPA fallback serves
      # for a missing file. It also marks the club seeded BEFORE fetching, so one
      # miss leaves it permanently empty. Fail here instead, with a clear reason.
      - name: Verify seed assets are in the build output
        run: test -s website/dist/data/clubs/demo/club.json

      # Starts its own server via playwright.config.ts's webServer, which also
      # applies the migrations. See the e2e:serve script.
      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: playwright-report/
          retention-days: 7

  # TEMPORARY — delete before merge.
  #
  # The real gate lives in main.yml and only runs on pushes to main, so there is no
  # way to prove the Cloudflare Access service token works without either merging
  # first or dispatching main.yml (which would deploy to production). Secrets do
  # resolve for same-repo pull requests, so this copy of the job exercises the real
  # token under the real secret names, on this PR, with the production deploy and
  # the preview migration removed.
  #
  # Reverted in the next commit once the run is green.
  preview-e2e-probe:
    name: TEMPORARY Access verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm ci
        working-directory: website


      # Preview deployments sit behind Cloudflare Access, so reaching one needs a
      # service token (Zero Trust -> Access -> Service Auth, with a Service Auth
      # policy on the application covering *.clubsplatform.pages.dev). Without it
      # every request is answered with a 302 to <team>.cloudflareaccess.com.
      #
      # Secrets cannot be referenced from a job-level `if:`, so the check happens
      # here and every step below is conditioned on its output. Skipping leaves the
      # job successful on purpose: main keeps shipping while the token is being set
      # up, and the gate switches itself on as soon as both secrets exist.
      - name: Check for Cloudflare Access credentials
        id: access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview E2E skipped::CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET are not set. Preview deployments are behind Cloudflare Access, so the smoke suite cannot reach one without a service token. Production deploy proceeds ungated."
          fi

      - name: Install Playwright browser
        if: steps.access.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      # No POSTHOG_CLI_* here, unlike the production build below: a throwaway
      # preview must not create a PostHog release or upload source maps. That is
      # also why the deploy job builds again rather than reusing an artifact from
      # this job — the plugin stamps chunk ids at build time, so the two bundles
      # genuinely differ.
      - name: Build
        if: steps.access.outputs.configured == 'true'
        run: npm run build
        working-directory: website
        env:
          VITE_POSTHOG_DISABLED: 'true'
          VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      - name: Verify seed assets are in the build output
        if: steps.access.outputs.configured == 'true'
        run: test -s website/dist/data/clubs/demo/club.json

      # --branch must NOT be "main". Pages treats a deploy whose branch matches the
      # project's production branch as a production deployment, so that one flag
      # would ship this commit to production before any of the tests below ran.
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        if: steps.access.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy website/dist --project-name=clubsplatform --branch=ci-verify

      # The immutable per-deployment URL, not the branch alias: Cloudflare
      # sanitizes and truncates aliases, so the alias host is not reliably
      # predictable.
      - name: Resolve the deployment URL
        if: steps.access.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          COMMAND_STDERR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          url="$DEPLOYMENT_URL"
          if [ -z "$url" ]; then
            echo "deployment-url output was empty; falling back to the command output."
            url=$(printf '%s\n%s\n' "$COMMAND_OUTPUT" "$COMMAND_STDERR" \
              | grep -oE 'https://[0-9a-f]+\.clubsplatform\.pages\.dev' \
              | head -n 1)
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the preview deployment URL."
            exit 1
          fi
          echo "Preview deployment: $url"
          echo "E2E_BASE_URL=$url" >> "$GITHUB_ENV"

      # Poll /api/clubs rather than /: the SPA shell answers 200 before D1 is
      # reachable, and requiring the demo club in the body catches cold start,
      # propagation and an empty registry in one check.
      #
      # The status code is captured rather than leaning on `curl -f`, so an Access
      # redirect can be reported as what it is. A 302 to cloudflareaccess.com here
      # means the service token is wrong, or its policy is not a Service Auth
      # policy — which otherwise presents as an indistinguishable timeout.
      - name: Wait for the deployment to serve the club registry
        if: steps.access.outputs.configured == 'true'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          body=$(mktemp)
          status=0
          for i in $(seq 1 30); do
            status=$(curl -sS -o "$body" -w '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$E2E_BASE_URL/api/clubs" || true)
            if [ "$status" = "200" ] && grep -q '"slug":"demo"' "$body"; then
              echo "Ready after $((i * 2))s."
              exit 0
            fi
            sleep 2
          done
          echo "::error::$E2E_BASE_URL/api/clubs did not report the demo club within 60s (last status: $status)."
          if [ "$status" = "302" ] || grep -qi 'cloudflareaccess\.com' "$body"; then
            echo "::error::Cloudflare Access rejected the request. Check that CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET match a current service token, and that the Access application covering *.clubsplatform.pages.dev has a policy whose action is Service Auth — an Allow policy will not accept service-token headers."
          fi
          head -c 500 "$body" || true
          exit 1

      # Every spec is @smoke today, so this is the whole suite. The tag stays as
      # the contract for "safe to run against the shared preview database", which
      # these specs must remain: they are read-only.
      - name: Run E2E smoke tests
        if: steps.access.outputs.configured == 'true'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7
