name: Dependabot auto-merge

# Squash-merges Dependabot's updates (patch, minor AND major) once CI has passed
# on them; CI is the only gate. It only ever touches pull requests opened by
# dependabot[bot]. No ruleset or branch protection is involved, so nobody else's
# pull requests or pushes are gated by anything here. GitHub Actions bumps are
# the one exception and stay manual (see below).
#
# Two jobs:
#
#   label  (pull_request_target) reads the PR with dependabot/fetch-metadata
#          and adds the `automerge:ok` label to every update, whatever its
#          update-type: patch, minor, major, or empty/unknown (which some
#          security updates report). That is deliberate, since the merge job
#          still requires CI to pass. The one exception is GitHub Actions bumps
#          (package-ecosystem github_actions): they are never labelled, and the
#          label is removed if present, because they edit .github/workflows/
#          and GITHUB_TOKEN cannot be granted the `workflows` permission needed
#          to merge such a change.
#
#   merge  (workflow_run, after Test, E2E or CodeQL completes for a PR) merges
#          only when the PR is still open, authored by dependabot[bot], carries
#          `automerge:ok`, its head is still the commit CI ran against, and the
#          latest "Tests with coverage", "E2E against a local preview build" and
#          "Analyze (javascript-typescript)" check runs on that commit all
#          concluded success, and nothing under .github/workflows/ is changed.
#          Anything else exits quietly. Whichever of the three workflows
#          finishes last does the merge; a merge GitHub refuses (a conflict, or
#          a stale branch after a sibling merged) is reported as a warning and
#          left for Dependabot to rebase.
#
# Neither job checks out or runs the PR's code; that is what makes the
# pull_request_target and workflow_run triggers (which carry a write token) safe
# here. Keep it that way.
#
# Deploying: a merge made with GITHUB_TOKEN does not fire main.yml's push
# trigger, so after a successful merge the merge job dispatches main.yml
# ("Deploy to Cloudflare Pages") on main itself. GITHUB_TOKEN is allowed to start
# workflow_dispatch runs, and a dispatched run is the same pipeline as a push:
# tests, then E2E against a Cloudflare preview, then the production deploy.
# main.yml's "cloudflare-pages" concurrency group keeps near-simultaneous
# dispatches from racing; each run deploys main as it stands when dispatched.
# A failed dispatch is only a warning, since the merge itself has happened.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Test", "E2E", "CodeQL"]
    types: [completed]

permissions: {}

jobs:
  label:
    name: Label for auto-merge
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add automerge:ok
        # Any update type, majors and empty/unknown included: CI is the gate.
        if: steps.metadata.outputs.package-ecosystem != 'github_actions'
        run: gh api "repos/$REPO/issues/$PR_NUMBER/labels" -f 'labels[]=automerge:ok' --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Remove automerge:ok
        if: >-
          contains(github.event.pull_request.labels.*.name, 'automerge:ok') &&
          steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/automerge%3Aok" --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  merge:
    name: Merge once CI has passed
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    # The three CI workflows finish at different times; never evaluate the same
    # commit twice at once.
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Merge if every required check passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # The open Dependabot PR (from this repo) whose head is still this commit.
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '
            [ .[]
              | select(.state == "open"
                  and .user.login == "dependabot[bot]"
                  and .head.sha == env.HEAD_SHA
                  and .head.repo.full_name == env.REPO
                  and .base.repo.full_name == env.REPO)
            ] | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR has $HEAD_SHA as its head; nothing to do."
            exit 0
          fi

          # Re-read the PR itself rather than trusting the list above.
          labelled=$(gh api "repos/$REPO/pulls/$pr" --jq '
            .state == "open"
            and .user.login == "dependabot[bot]"
            and .head.sha == env.HEAD_SHA
            and ([.labels[].name] | index("automerge:ok") != null)')
          if [ "$labelled" != "true" ]; then
            echo "PR #$pr is not an open, automerge:ok-labelled Dependabot PR at $HEAD_SHA; leaving it."
            exit 0
          fi

          # Latest run of each required check on this commit, from GitHub Actions
          # only (app id 15368), so no other app can satisfy a check by name.
          runs=$(gh api --paginate \
            "repos/$REPO/commits/$HEAD_SHA/check-runs?app_id=15368&per_page=100" \
            --jq '.check_runs[] | [.id, .name, .status, (.conclusion // "none")] | @tsv')

          for check in "Tests with coverage" "E2E against a local preview build" "Analyze (javascript-typescript)"; do
            latest=$(printf '%s\n' "$runs" \
              | awk -F'\t' -v name="$check" '$2 == name' \
              | sort -t "$(printf '\t')" -k1,1n | tail -n 1)
            status=$(printf '%s' "$latest" | cut -f3)
            conclusion=$(printf '%s' "$latest" | cut -f4)
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              echo "\"$check\" is ${status:-missing}/${conclusion:-none} on $HEAD_SHA; not merging PR #$pr yet."
              exit 0
            fi
          done

          # GITHUB_TOKEN cannot merge changes to workflow files, so leave any
          # such PR (normally a GitHub Actions bump) for a manual merge.
          workflow_files=$(gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" \
            --jq '.[] | select(.filename | startswith(".github/workflows/")) | .filename')
          if [ -n "$workflow_files" ]; then
            echo "::notice::PR #$pr changes .github/workflows/ ($(echo "$workflow_files" | paste -sd, -)); GITHUB_TOKEN cannot merge workflow changes, leaving it for a manual merge."
            exit 0
          fi

          echo "All required checks passed on $HEAD_SHA; squash-merging PR #$pr."
          if ! gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"; then
            echo "::warning::Could not merge PR #$pr at $HEAD_SHA (conflict, or the branch is stale after another merge). Leaving it for Dependabot to rebase."
            exit 0
          fi

          # The merge's push does not trigger main.yml (it was made with
          # GITHUB_TOKEN), so start the production deploy explicitly.
          if gh workflow run main.yml --repo "$REPO" --ref main; then
            echo "Dispatched \"Deploy to Cloudflare Pages\" on main after merging PR #$pr."
          else
            echo "::warning::Merged PR #$pr but could not dispatch main.yml; run \"Deploy to Cloudflare Pages\" on main manually to ship it."
          fi
