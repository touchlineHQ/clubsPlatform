name: Dependabot auto-merge

# Caller for the shared touchlineHQ Dependabot auto-merge workflow. The policy,
# safety checks and full documentation live in
# touchlineHQ/.github/.github/workflows/dependabot-auto-merge.yml.
# Reusable workflows cannot declare triggers, so they stay here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    # Workflow `name:` values whose completion may attempt a merge, exactly.
    workflows: ["Test", "E2E", "CodeQL"]
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    # Pinned to a commit SHA: this runs with a write token.
    uses: touchlineHQ/.github/.github/workflows/dependabot-auto-merge.yml@6e7b87fea5fde33ec3e6258e06bfbe63814ffd42
    # Must cover every permission any job in the reusable workflow declares,
    # or GitHub rejects the whole run at startup (startup_failure). The label
    # job declares issues: write to create automerge-label on first use.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: write
    with:
      # Patch and minor only. Majors (including a grouped PR containing one) are
      # left for Scott to review (adamsuk/software-factory#10). A review is
      # requested from the logins in `reviewers` once the checks below pass
      # (touchlineHQ/.github#4).
      allowed-updates: minor
      reviewers: adamsuk
      allow-unclassified: "true"
      skip-ecosystems: github_actions
      required-checks: |
        Tests with coverage
        E2E against a local preview build
        Analyze (javascript-typescript)
      deploy-workflow: main.yml
      deploy-ref: main
      merge-method: squash
      automerge-label: automerge:ok
